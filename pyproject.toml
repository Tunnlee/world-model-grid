[project]
name = "world-model-grid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ILunbn", email = "trungtuan513@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "torchvision>=0.29.2",
    "wandb>=0.31.0",
]

[project.scripts]
world-model-grid = "world_model_grid:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "mypy>=2.4.1",
    "numpy>=2.5.4",
    "pytest>=9.2.0",
    "torch>=2.15.0",
]
